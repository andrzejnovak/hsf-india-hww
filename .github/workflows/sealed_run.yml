# The sealed run of the hackathon, on throwaway machines: every comment on the submissions issue (issue 1)
# scores every submission on the sealed suite and commits the leaderboard table into README.md. Three jobs:
# plan reads the issue (and replies to a comment with a URL in it but no `<team>: <url> @ <commit>` line, which
# would otherwise be skipped in silence) and decides who needs a run; score runs once per such team, each on a
# runner of its own, building the same suite from the secret and scoring that team alone; publish gathers the
# runners' results with the cache for everyone else and commits the table and the plots: mu on the sealed datasets,
# all at the 125 GeV mass.
# With the SEALED_SEED repository secret (Settings > Secrets and variables > Actions; any long random string, e.g.
# python3 -c 'import secrets; print(secrets.token_hex(16))') the suite is the same every run, so results are
# comparable and a team whose commit was scored before is read from results/cache instead of re-run; without it
# the suite is fresh each run and nothing is cached. Every run publishes each team's recovery plot under the tables
# (they show the planted values of the suite; "Run workflow" with plots: false leaves them out) and a cached team
# keeps its plot from before; fresh: true ignores the cache for the final run. The runtime a submission gets is
# numpy, scipy and the CPU build of torch (EVAL_CONTRACT.md: inference, the model trained beforehand).
name: sealed run

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      n:
        description: "datasets in the sealed suite (public seed_000 included), all at the 125 GeV mass"
        default: "51"
      plots:
        description: "publish each team's recovery plot too (they show the planted values of the sealed datasets)"
        type: boolean
        default: true
      fresh:
        description: "ignore the cache: score every submission again (the final run)"
        type: boolean
        default: false
      seed:
        description: "a master seed by hand (empty: the SEALED_SEED secret, or made up for this run; never printed)"
        default: ""

concurrency:
  group: sealed-run
  cancel-in-progress: false

permissions:
  contents: write
  issues: write      # the reply to a comment that carries no submission line

env:
  N: ${{ github.event.inputs.n || '51' }}
  FRESH: ${{ github.event.inputs.fresh == 'true' && '--fresh' || '' }}
  SEED_ARG: ${{ github.event.inputs.seed != '' && format('--seed {0}', github.event.inputs.seed) || '' }}

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      todo: ${{ steps.plan.outputs.todo }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet numpy scipy matplotlib
      - name: the submissions, and who needs a run
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # the issue API call and the replies; dropped by sealed_run.py right after
          SEALED_SEED: ${{ secrets.SEALED_SEED }}     # the cache key; dropped the same way
        run: |
          python organiser/sealed_run.py --stage plan --plan-out /tmp/plan.json --publish README.md --notify --n "$N" $FRESH $SEED_ARG
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          todo = json.load(open("/tmp/plan.json"))["todo"]
          print("todo=" + json.dumps(todo))
          print("any=" + ("true" if todo else "false"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: /tmp/plan.json
          retention-days: 3

  score:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        sub: ${{ fromJSON(needs.plan.outputs.todo) }}   # <team>@<commit>: each team's latest submission not in the cache
    runs-on: ubuntu-latest
    timeout-minutes: 100   # the suite, the self-check (two runs of the public dataset) and the 60-minute budget
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --quiet numpy scipy matplotlib
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu   # the CPU build, alone on its index: what a submission may import
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: /tmp
      - name: score ${{ matrix.sub }} on this runner
        env:
          SEALED_SEED: ${{ secrets.SEALED_SEED }}     # the same suite as every other runner; dropped before the submission runs
        run: |
          python organiser/sealed_run.py --stage score --plan /tmp/plan.json --sub "${{ matrix.sub }}" --out /tmp/sealed --as nobody \
            --team-budget 3600 --n "$N" $SEED_ARG
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.sub }}
          path: |
            /tmp/sealed/results/${{ matrix.sub }}
            /tmp/sealed/cache
          if-no-files-found: ignore
          retention-days: 3

  publish:
    needs: [plan, score]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}   # also when a scoring job failed, never when the run is cancelled
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet numpy scipy matplotlib
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: /tmp
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.any == 'true'
        with:
          pattern: result-*
          path: /tmp/sealed
          merge-multiple: true
      - name: the leaderboard
        env:
          SEALED_SEED: ${{ secrets.SEALED_SEED }}
        run: |
          python organiser/sealed_run.py --stage publish --plan /tmp/plan.json --out /tmp/sealed --publish README.md --team-budget 3600 --n "$N" \
            ${{ github.event.inputs.plots != 'false' && '--plots' || '' }} $FRESH $SEED_ARG
      - name: commit the leaderboard
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "sealed run"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p results && git add README.md results
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -q -m "Hackathon leaderboard: sealed run of $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main && exit 0
            sleep 5
          done
          exit 1
