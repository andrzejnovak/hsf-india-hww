# The sealed run of the hackathon, on a throwaway machine: every comment on the submissions issue (issue 1)
# scores every submission on the sealed suite and commits the leaderboard table into README.md. With the
# SEALED_SEED repository secret (Settings > Secrets and variables > Actions; any long random string, e.g.
# python3 -c 'import secrets; print(secrets.token_hex(16))') the suite is the same every run, so results are
# comparable and a team whose commit was scored before is read from results/cache instead of re-run; without it
# the suite is fresh each run and nothing is cached. Every run publishes each team's recovery plot under the tables
# (they show the planted values of the suite; "Run workflow" with plots: false leaves them out) and a cached team
# keeps its plot from before; fresh: true ignores the cache for the final run. A comment with a URL in it but no `<team>: <url> @ <commit>`
# line (a team name with a space, say) gets a reply saying so instead of being skipped in silence. The runtime a
# submission gets is numpy, scipy and the CPU build of torch (EVAL_CONTRACT.md: inference, the model trained beforehand).
name: sealed run

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      n:
        description: "datasets in the sealed suite (public seed_000 included; half of the drawn ones keep the mass at 125)"
        default: "31"
      plots:
        description: "publish each team's recovery plot too (they show the planted values of the sealed datasets)"
        type: boolean
        default: true
      fresh:
        description: "ignore the cache: score every submission again (the final run)"
        type: boolean
        default: false
      seed:
        description: "a master seed by hand (empty: the SEALED_SEED secret, or made up for this run; never printed)"
        default: ""

concurrency:
  group: sealed-run
  cancel-in-progress: false

permissions:
  contents: write
  issues: write      # the reply to a comment that carries no submission line

jobs:
  score:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --quiet numpy scipy matplotlib
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu   # the CPU build, alone on its index: what a submission may import
      - name: score every submission on a sealed suite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # read by sealed_run.py for the issue API call and dropped before any submission runs
          SEALED_SEED: ${{ secrets.SEALED_SEED }}     # the fixed suite's secret; dropped from the environment the same way
        run: |
          python organiser/sealed_run.py --out /tmp/sealed --as nobody --publish README.md --jobs 2 --team-budget 3600 --notify \
            --n "${{ github.event.inputs.n || '31' }}" \
            ${{ github.event.inputs.plots != 'false' && '--plots' || '' }} \
            ${{ github.event.inputs.fresh == 'true' && '--fresh' || '' }} \
            ${{ github.event.inputs.seed != '' && format('--seed {0}', github.event.inputs.seed) || '' }}
      - name: commit the leaderboard
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "sealed run"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p results && git add README.md results
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -q -m "Hackathon leaderboard: sealed run of $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main && exit 0
            sleep 5
          done
          exit 1
